<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="hhi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="34" fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle">Lex-TM: Two-Stage Indexing &amp; Routing</text>

  <!-- ============ OFFLINE (indexing) ============ -->
  <rect x="30" y="60" width="450" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="52" y="86" fill="#475569" font-size="14" font-weight="700">OFFLINE · Indexing</text>

  <!-- corpus -->
  <rect x="60" y="104" width="120" height="46" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="120" y="132" fill="#0c4a6e" font-size="14" text-anchor="middle">Corpus</text>

  <!-- chunk + tokenize -->
  <rect x="60" y="180" width="120" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="120" y="202" fill="#334155" font-size="13" text-anchor="middle">Chunk +</text>
  <text x="120" y="218" fill="#334155" font-size="13" text-anchor="middle">Tokenize</text>

  <!-- two parallel branches -->
  <!-- dense embed -->
  <rect x="240" y="120" width="200" height="60" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="340" y="145" fill="#0c4a6e" font-size="14" font-weight="600" text-anchor="middle">Dense Encoder</text>
  <text x="340" y="164" fill="#0369a1" font-size="12" text-anchor="middle">BGE-m3 / Qwen3-Embedding</text>

  <!-- HHI topic model -->
  <rect x="240" y="212" width="200" height="76" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="340" y="236" fill="#3730a3" font-size="14" font-weight="600" text-anchor="middle">Lex-TM Topic Model</text>
  <text x="340" y="255" fill="#4f46e5" font-size="12" text-anchor="middle">LDA + HHI exclusivity prior</text>
  <text x="340" y="272" fill="#6366f1" font-size="11" text-anchor="middle">(Gibbs sampling, τ-amplified β)</text>

  <!-- caches -->
  <rect x="240" y="320" width="95" height="44" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="287" y="342" fill="#166534" font-size="12" text-anchor="middle">emb</text>
  <text x="287" y="356" fill="#166534" font-size="11" text-anchor="middle">cache</text>
  <rect x="345" y="320" width="95" height="44" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="392" y="342" fill="#166534" font-size="12" text-anchor="middle">topic</text>
  <text x="392" y="356" fill="#166534" font-size="11" text-anchor="middle">cache</text>

  <!-- offline arrows -->
  <line x1="120" y1="150" x2="120" y2="178" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M180 196 C 210 196, 210 150, 238 150" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <path d="M180 210 C 210 210, 210 250, 238 250" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="180" x2="340" y2="210" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <path d="M320 288 C 320 305, 300 305, 292 318" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <path d="M360 288 C 360 305, 380 305, 388 318" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ ONLINE (retrieval) ============ -->
  <rect x="520" y="60" width="450" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="542" y="86" fill="#475569" font-size="14" font-weight="700">ONLINE · Retrieval</text>

  <!-- query -->
  <rect x="560" y="180" width="110" height="46" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="615" y="208" fill="#0c4a6e" font-size="14" text-anchor="middle">Query</text>

  <!-- dense sim + jsd -->
  <rect x="710" y="120" width="150" height="52" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="785" y="142" fill="#0c4a6e" font-size="13" text-anchor="middle">Dense cosine</text>
  <text x="785" y="159" fill="#0369a1" font-size="11" text-anchor="middle">similarity</text>

  <rect x="710" y="234" width="150" height="52" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="785" y="256" fill="#3730a3" font-size="13" text-anchor="middle">Topic sim (1−JSD)</text>
  <text x="785" y="273" fill="#4f46e5" font-size="11" text-anchor="middle">via cached θ</text>

  <!-- interpolate -->
  <rect x="710" y="330" width="150" height="52" rx="8" fill="url(#hhi)"/>
  <text x="785" y="352" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Interpolate</text>
  <text x="785" y="369" fill="#e0e7ff" font-size="11" text-anchor="middle">γ·dense + (1−γ)·topic</text>

  <!-- online arrows -->
  <path d="M670 196 C 690 196, 690 146, 708 146" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <path d="M670 210 C 690 210, 690 260, 708 260" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <path d="M785 172 C 785 195, 785 195, 785 328" stroke="#94a3b8" fill="none" stroke-dasharray="3 3"/>
  <path d="M785 286 L 785 328" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>

  <!-- cache feeds online (dashed cross-boundary) -->
  <path d="M440 342 C 490 342, 500 146, 708 146" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.7"/>
  <path d="M440 342 C 490 342, 500 260, 708 260" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.7"/>

  <text x="500" y="424" fill="#94a3b8" font-size="11" text-anchor="middle">Dashed green = cached artifacts reused at query time · No neural fine-tuning · CPU-friendly topic model</text>
</svg>
