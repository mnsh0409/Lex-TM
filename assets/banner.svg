<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.35">
    <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360 M640 0 V360 M800 0 V360 M960 0 V360 M1120 0 V360"/>
  </g>

  <!-- schematic: query -> [dense + topic router] -> ranked docs -->
  <g transform="translate(96, 264)" opacity="0.92">
    <!-- query node -->
    <circle cx="0" cy="0" r="14" fill="#38bdf8" filter="url(#glow)"/>
    <text x="0" y="42" fill="#94a3b8" font-size="13" text-anchor="middle">query</text>

    <!-- edges to router -->
    <path d="M14 0 C 70 0, 90 -34, 150 -34" stroke="url(#accent)" stroke-width="2.5" fill="none"/>
    <path d="M14 0 C 70 0, 90 34, 150 34" stroke="url(#accent)" stroke-width="2.5" fill="none"/>

    <!-- router boxes -->
    <rect x="150" y="-52" width="150" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="225" y="-29" fill="#e2e8f0" font-size="14" text-anchor="middle">Dense (BGE / Qwen)</text>
    <rect x="150" y="16" width="150" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="225" y="39" fill="#e2e8f0" font-size="14" text-anchor="middle">Lex-TM Topic Prior</text>

    <!-- fuse -->
    <path d="M300 -34 C 340 -34, 350 0, 388 0" stroke="url(#accent)" stroke-width="2.5" fill="none"/>
    <path d="M300 34 C 340 34, 350 0, 388 0" stroke="url(#accent)" stroke-width="2.5" fill="none"/>
    <circle cx="392" cy="0" r="11" fill="#818cf8" filter="url(#glow)"/>
    <text x="392" y="34" fill="#94a3b8" font-size="12" text-anchor="middle">interpolate</text>

    <!-- ranked docs -->
    <g transform="translate(452,-42)">
      <rect x="0" y="0" width="120" height="18" rx="4" fill="#38bdf8" opacity="0.9"/>
      <rect x="0" y="26" width="120" height="18" rx="4" fill="#475569"/>
      <rect x="0" y="52" width="120" height="18" rx="4" fill="#475569"/>
      <rect x="0" y="78" width="120" height="18" rx="4" fill="#475569"/>
      <text x="60" y="112" fill="#94a3b8" font-size="12" text-anchor="middle">ranked results</text>
    </g>
    <path d="M403 0 C 425 0, 430 -33, 450 -33" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- title block -->
  <text x="96" y="96" fill="#f8fafc" font-size="60" font-weight="800" letter-spacing="-1">Lex-TM</text>
  <rect x="98" y="112" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="98" y="150" fill="#cbd5e1" font-size="23" font-weight="500">Lexically-Guided Topic-Model Routing for Dense Retrieval</text>
  <text x="98" y="182" fill="#64748b" font-size="16">Mitigating domain saturation in specialized, short-form text retrieval</text>

  <!-- corner tag -->
  <g transform="translate(1080, 56)">
    <rect x="0" y="-24" width="128" height="34" rx="17" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="64" y="-2" fill="#7dd3fc" font-size="15" font-weight="600" text-anchor="middle">AACL 2026</text>
  </g>
</svg>
